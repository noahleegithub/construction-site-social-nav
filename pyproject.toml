[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-nav"
version = "0.1.0"
description = "Heterogeneous trajectory prediction and social navigation for construction-site robots"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Noah Lee" }]
dependencies = [
    "numpy",
    "matplotlib",
    "cvxopt",
]

[project.optional-dependencies]
# Learned predictors (MotionDiffuser-style diffusion model and reduced Trajectron++).
ml = ["torch"]
# The Robotarium simulator is distributed from GitHub only.
robotarium = ["robotarium-python-simulator @ git+https://github.com/robotarium/robotarium_python_simulator"]
dev = ["pytest"]

[project.scripts]
construction-nav = "construction_nav.cli:main"

[tool.setuptools.packages.find]
include = ["construction_nav*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end Robotarium runs (deselect with '-m \"not slow\"')",
]
